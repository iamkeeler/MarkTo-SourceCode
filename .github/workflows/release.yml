name: Build and Release MarkTo

on:
  push:
    branches: [ release ]
  workflow_dispatch: # Allow manual triggering

# Security: Restrict permissions to minimum required
permissions:
  contents: write # Required to publish the GitHub release

env:
  APP_NAME: MarkTo
  SCHEME: MarkTo
  CONFIGURATION: Release
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608  # v4.1.0 pinned to SHA
    - name: Run security scan
      run: |
        echo "🔍 Scanning for potential security issues..."
        # Check for hardcoded credentials
        if grep -r -i "password\|secret\|key\|token" . --exclude-dir=.git --exclude-dir=.github --exclude="*.md" --exclude="*.yml" --exclude="*.yaml"; then
          echo "⚠️  Warning: Found potential credential keywords in code"
        else
          echo "✅ No obvious credential keywords found"
        fi
        # Check recent commits
        echo "📋 Recent commits:"
        git log --oneline -n 5

  build-and-release:
    needs: security-scan
    runs-on: macos-latest
    environment: production  # Requires manual approval for security
    timeout-minutes: 60      # Prevent runaway jobs
    
    steps:
    - name: Checkout code
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608  # v4.1.0 pinned to SHA
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
    - name: Show Xcode version
      run: xcodebuild -version

    - name: Run standalone regression suite
      run: |
        set -euo pipefail
        mkdir -p scratch/module-cache
        swiftc -module-cache-path ./scratch/module-cache \
          MarkTo/Models/*.swift \
          MarkTo/Services/AppSettings.swift \
          MarkTo/ViewModels/*.swift \
          scripts/run_test_suite.swift \
          -o ./scratch/test_runner
        ./scratch/test_runner

    - name: Run native macOS unit tests
      run: |
        set -euo pipefail
        xcodebuild test \
          -project MarkTo.xcodeproj \
          -scheme "$SCHEME" \
          -configuration Debug \
          -destination "platform=macOS,arch=$(uname -m)" \
          -derivedDataPath TestDerivedData \
          -only-testing:MarkToTests \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO

    - name: Validate unsigned Release build
      run: |
        set -euo pipefail
        xcodebuild \
          -project MarkTo.xcodeproj \
          -scheme "$SCHEME" \
          -configuration "$CONFIGURATION" \
          -destination "generic/platform=macOS" \
          -derivedDataPath ValidationDerivedData \
          build \
          ARCHS="arm64 x86_64" \
          ONLY_ACTIVE_ARCH=NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO
      
    - name: Import Code Signing Certificates
      env:
        DEVELOPER_ID_APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      run: |
        set -euo pipefail

        echo "🔐 Setting up secure keychain..."
        
        # Create unique keychain name to avoid conflicts
        KEYCHAIN_NAME="build-$(uuidgen).keychain"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
        security default-keychain -s "$KEYCHAIN_NAME"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
        security set-keychain-settings -t 1800 -u "$KEYCHAIN_NAME"  # 30 min timeout
        
        echo "📦 Importing certificates..."
        echo "$DEVELOPER_ID_APPLICATION_P12" | base64 -D > app_cert.p12

        if [ ! -s app_cert.p12 ]; then
          echo "❌ Developer ID Application certificate is empty or invalid"
          exit 1
        fi

        security import app_cert.p12 -k "$KEYCHAIN_NAME" -P "$CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"

        rm -f app_cert.p12

        echo "✅ Developer ID Application certificate imported successfully:"
        security find-identity -v -p codesigning "$KEYCHAIN_NAME" | grep -F "Developer ID Application"
        
        # Set default keychain for codesign operations
        security default-keychain -s "$KEYCHAIN_NAME"
        
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
    
    - name: Get version number
      id: version
      run: |
        set -euo pipefail
        VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' MarkTo/Info.plist)
        BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' MarkTo/Info.plist)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "build=$BUILD" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
    
    - name: Build app
      run: |
        set -euo pipefail
        # List available signing identities for debugging
        echo "🔍 Available signing identities:"
        security find-identity -v -p codesigning
        
        # Use the team ID from GitHub secrets (which we just verified)
        TEAM_ID="${{ secrets.TEAM_ID }}"
        echo "🏷️ Using Team ID: '$TEAM_ID'"
        
        # Build with manual code signing for notarization
        xcodebuild \
          -project MarkTo.xcodeproj \
          -scheme $SCHEME \
          -configuration $CONFIGURATION \
          -destination "generic/platform=macOS" \
          -derivedDataPath DerivedData \
          -archivePath "DerivedData/$APP_NAME.xcarchive" \
          archive \
          ARCHS="arm64 x86_64" \
          ONLY_ACTIVE_ARCH=NO \
          CODE_SIGN_IDENTITY="Developer ID Application" \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM="$TEAM_ID" \
          ENABLE_HARDENED_RUNTIME=YES \
          OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
          PROVISIONING_PROFILE=""
    
    - name: Export app
      run: |
        set -euo pipefail
        # Avoid xcodebuild -exportArchive, which has been unreliable in CI.
        # The archived app is already signed by the preceding archive action.
        echo "📦 Extracting app from archive..."
        
        # Create export directory
        mkdir -p "DerivedData/Export"
        
        # Extract the .app from the .xcarchive
        cp -R "DerivedData/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" "DerivedData/Export/"
        
        if [ -d "DerivedData/Export/$APP_NAME.app" ]; then
          echo "✅ Signed app extracted successfully"
          echo "📋 App info:"
          ls -la "DerivedData/Export/$APP_NAME.app"
          
          # Verify code signing
          echo "🔍 Verifying code signature:"
          codesign --verify --deep --strict --verbose=4 "DerivedData/Export/$APP_NAME.app"
          codesign -d --verbose=4 "DerivedData/Export/$APP_NAME.app" 2>&1
          
          # Verify entitlements
          echo "🔍 Verifying entitlements:"
          codesign -d --entitlements :- "DerivedData/Export/$APP_NAME.app" 2>&1
        else
          echo "❌ Failed to extract app"
          exit 1
        fi
    
    - name: Notarize app
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        set -euo pipefail
        # Create notarization credentials
        xcrun notarytool store-credentials "notarytool-profile" \
          --apple-id "$APPLE_ID" \
          --password "$APPLE_ID_PASSWORD" \
          --team-id "$TEAM_ID"
        
        # Create a zip for notarization
        cd DerivedData/Export
        ditto -c -k --keepParent "$APP_NAME.app" "$APP_NAME.zip"
        
        # Submit for notarization
        xcrun notarytool submit "$APP_NAME.zip" \
          --keychain-profile "notarytool-profile" \
          --wait
        
        # Staple the notarization
        xcrun stapler staple "$APP_NAME.app"
        xcrun stapler validate "$APP_NAME.app"

        # Gatekeeper assessment must pass before the app is packaged.
        spctl --assess --type execute --verbose=4 "$APP_NAME.app"
    
    - name: Create DMG
      run: |
        set -euo pipefail
        # Create a temporary directory for DMG contents
        mkdir -p "DMG"
        cp -R "DerivedData/Export/$APP_NAME.app" "DMG/"
        
        # Create Applications symlink
        ln -s /Applications "DMG/Applications"
        
        # Create DMG
        hdiutil create -volname "MarkTo ${{ steps.version.outputs.version }}" \
          -srcfolder "DMG" \
          -ov -format UDZO \
          "DerivedData/$APP_NAME-${{ steps.version.outputs.version }}.dmg"
    
    - name: Generate checksums
      run: |
        set -euo pipefail
        cd DerivedData
        shasum -a 256 "$APP_NAME-${{ steps.version.outputs.version }}.dmg" > "$APP_NAME-${{ steps.version.outputs.version }}.dmg.sha256"
    
    - name: Create release notes
      run: |
        cat > RELEASE_NOTES.md << EOF
        # MarkTo ${{ steps.version.outputs.version }}
        
        ## What's New
        - Bug fixes and improvements
        - Enhanced performance and stability
        - Updated user interface elements
        
        ## Installation

        1. Download \`MarkTo-${{ steps.version.outputs.version }}.dmg\`
        2. Open the DMG file
        3. Drag MarkTo to your Applications folder
        
        ## System Requirements
        - macOS 13.0 or later
        - Apple Silicon or Intel processor
        
        ## Verification
        The app is signed with a Developer ID certificate and notarized by Apple.
        
        Verify the download with \`MarkTo-${{ steps.version.outputs.version }}.dmg.sha256\`.
        
        ## Open Source
        MarkTo is open source! View the code at: https://github.com/iamkeeler/MarkTo-SourceCode
        
        ## License
        Creative Commons Attribution-NonCommercial 4.0 International License
        
        For commercial licensing, contact: gary@attach.design
        EOF
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844  # v1 pinned to SHA
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: MarkTo ${{ steps.version.outputs.version }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false
        files: |
          DerivedData/MarkTo-${{ steps.version.outputs.version }}.dmg
          DerivedData/MarkTo-${{ steps.version.outputs.version }}.dmg.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Security cleanup
      if: always()
      run: |
        echo "🧹 Performing security cleanup..."
        
        # Remove any temporary certificate files
        rm -f app_cert.p12 || true
        rm -f ExportOptions.plist || true
        
        # Remove all build keychains (find by pattern)
        echo "🔐 Cleaning up keychains..."
        KEYCHAIN_LIST=$(security list-keychains | grep -E "build.*keychain" | tr -d '"' || true)
        if [ -n "$KEYCHAIN_LIST" ]; then
          for keychain in $KEYCHAIN_LIST; do
            echo "Removing keychain: $keychain"
            security delete-keychain "$keychain" || true
          done
        fi
        
        # Verify cleanup
        echo "✅ Security cleanup completed"
        security list-keychains | grep -E "build.*keychain" || echo "✅ No build keychains remaining"
